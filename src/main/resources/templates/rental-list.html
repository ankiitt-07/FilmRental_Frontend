<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rental List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .pagination-wrapper {
          overflow-x: auto;
          white-space: nowrap;
        }
    </style>
</head>
<body class="p-4">

<h1>Rental List</h1>

<!-- Action Buttons -->
<div class="mb-3">
    <a th:href="@{/rental/add}" class="btn btn-success">Add New Rental</a>
    <a th:href="@{/rental/toptenfilms}" class="btn btn-info">View Top 10 Rented Films</a>
</div>

<!-- Flash Messages -->
<div th:if="${param.success}" class="alert alert-success">
    <span th:text="${param.success}"></span>
</div>
<div th:if="${param.error}" class="alert alert-danger">
    <span th:text="${param.error}"></span>
</div>

<!-- Page Size Dropdown -->
<form method="get" th:action="@{/rental}" class="mb-3">
    <label for="size">Rows per page:</label>
    <select id="size" name="size" onchange="this.form.submit()">
        <option th:value="5" th:selected="${size == 5}">5</option>
        <option th:value="10" th:selected="${size == 10}">10</option>
        <option th:value="15" th:selected="${size == 15}">15</option>
        <option th:value="20" th:selected="${size == 20}">20</option>
        <option th:value="1000" th:selected="${size == 1000}">All</option>
    </select>
    <input type="hidden" name="page" th:value="${currentPage}" />
</form>

<!-- Rental Table -->
<table class="table table-striped">
    <thead>
    <tr>
        <th>ID</th>
        <th>Rental Date</th>
        <th>Customer ID</th>
        <th>Inventory ID</th>
        <th>Staff ID</th>
        <th>Return Date</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${rentals == null or #lists.isEmpty(rental)}">
        <td colspan="7">No rentals found</td>
    </tr>
    <tr th:each="rental : ${rental}">
        <td th:text="${rental.rentalId}"></td>
        <td th:text="${rental.rentalDate}"></td>
        <td th:text="${rental.customerId}"></td>
        <td th:text="${rental.inventoryId}"></td>
        <td th:text="${rental.staffId}"></td>
        <td th:text="${rental.returnDate}"></td>
        <td>
            <a th:href="@{'/rental/edit/' + ${rental.rentalId}}" class="btn btn-sm btn-primary">Edit</a>
        </td>
    </tr>
    </tbody>
</table>

<!-- Pagination -->
<nav th:if="${totalPages > 1}">
    <ul class="pagination">

        <!-- Previous -->
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{/rental(page=${currentPage - 1}, size=${size})}">Previous</a>
        </li>

        <!-- First page -->
        <li class="page-item" th:if="${currentPage > 2}">
            <a class="page-link" th:href="@{/rental(page=0, size=${size})}">1</a>
        </li>
        <li class="page-item disabled" th:if="${currentPage > 3}">
            <span class="page-link">...</span>
        </li>

        <!-- Dynamic middle pages -->
        <li class="page-item"
            th:each="i : ${#numbers.sequence((currentPage - 2 > 0 ? currentPage - 2 : 0), (currentPage + 2 < totalPages ? currentPage + 2 : totalPages - 1))}"
            th:classappend="${i == currentPage} ? 'active'">
            <a class="page-link" th:href="@{/rental(page=${i}, size=${size})}" th:text="${i + 1}"></a>
        </li>

        <!-- Last page -->
        <li class="page-item disabled" th:if="${currentPage < totalPages - 4}">
            <span class="page-link">...</span>
        </li>
        <li class="page-item" th:if="${currentPage < totalPages - 3}">
            <a class="page-link" th:href="@{/rental(page=${totalPages - 1}, size=${size})}" th:text="${totalPages}"></a>
        </li>

        <!-- Next -->
        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
            <a class="page-link" th:href="@{/rental(page=${currentPage + 1}, size=${size})}">Next</a>
        </li>

    </ul>
</nav>

</body>
</html>
