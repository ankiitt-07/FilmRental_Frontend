<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Films for Actor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Films for Actor</h1>

    <div class="mb-3">
        <a th:href="@{/actors/actors/assign-film/{id}(id=${actorId})}" class="btn btn-success">Assign Film</a>
        <a th:href="@{/actors}" class="btn btn-secondary">Back to Actors</a>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        <span th:text="${param.success}"></span>
    </div>
    <div th:if="${param.error}" class="alert alert-danger">
        <span th:text="${param.error}"></span>
    </div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Release Year</th>
            <th>Rental Duration</th>
            <th>Rental Rate</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="film : ${films}">
            <td th:text="${film.filmId}"></td>
            <td th:text="${film.title}"></td>
            <td th:text="${film.description}"></td>
            <td th:text="${film.releaseYear}"></td>
            <td th:text="${film.rentalDuration}"></td>
            <td th:text="${film.rentalRate}"></td>
        </tr>
        <tr th:if="${films == null or films.empty}">
            <td colspan="6">No films found for this actor</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
