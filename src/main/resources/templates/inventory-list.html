<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory List</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-6">
    <h1 class="text-2xl font-bold mb-6">Inventory List</h1>

    <div class="mb-4">
        <a th:href="@{/inventory/add}" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Insert New Inventory</a>
    </div>

    <div th:if="${param.success}" class="text-green-500 mb-4" th:text="${param.success}"></div>
    <div th:if="${error}" class="text-red-500 mb-4" th:text="${error}"></div>
    <div th:if="${warning}" class="text-yellow-500 mb-4" th:text="${warning}"></div>

    <!-- Debug Section -->
    <div class="mb-4 p-4 bg-gray-200 rounded">
        <h2 class="text-lg font-semibold">Debug Info</h2>
        <p>Store IDs: <span th:text="${storeIds} ?: 'None'"></span></p>
        <p>Inventories Count: <span th:text="${inventories != null ? #lists.size(inventories) : 0}"></span></p>
    </div>

    <!-- Store ID Dropdown -->
    <div class="mb-4">
        <label for="storeId" class="block text-gray-700">Select Store ID</label>
        <select id="storeId" class="w-full p-2 border rounded">
            <option value="">All Stores</option>
            <option th:each="storeId : ${storeIds}" th:value="${storeId}" th:text="${storeId}"></option>
        </select>
        <div th:if="${#lists.isEmpty(storeIds)}" class="text-gray-500 mt-2">No store IDs available</div>
    </div>

    <table class="w-full bg-white rounded shadow-md" id="inventoryTable">
        <thead>
        <tr class="bg-gray-200">
            <th class="p-2">Inventory ID</th>
            <th class="p-2">Film ID</th>
            <th class="p-2">Store ID</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="inventory : ${inventories}"
            th:data-store-id="${inventory.store?.storeId}"
            th:data-debug="${inventory.store != null ? inventory.store.storeId : 'null'}">
            <td class="p-2" th:text="${inventory.inventoryId} ?: 'N/A'"></td>
            <td class="p-2" th:text="${inventory.filmId} ?: 'N/A'"></td>
            <td class="p-2" th:text="${inventory.store?.storeId} ?: 'N/A'"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(inventories)}" class="no-data">
            <td colspan="3" class="p-2 text-center">No inventories found</td>
        </tr>
        </tbody>
    </table>

    <div th:if="${inventories != null and !#lists.isEmpty(inventories)}" class="mt-4">
        <nav aria-label="Page navigation">
            <ul class="flex space-x-2">
                <li th:class="${currentPage == 0} ? 'opacity-50 cursor-not-allowed' : ''">
                    <a th:href="@{/inventory(page=${currentPage - 1},size=10)}" class="px-4 py-2 bg-blue-500 text-white rounded" th:classappend="${currentPage == 0} ? 'pointer-events-none' : ''">Previous</a>
                </li>
                <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:class="${i == currentPage} ? 'bg-blue-600' : ''">
                    <a th:href="@{/inventory(page=${i},size=10)}" class="px-4 py-2 bg-blue-500 text-white rounded" th:text="${i + 1}"></a>
                </li>
                <li th:class="${currentPage == totalPages - 1} ? 'opacity-50 cursor-not-allowed' : ''">
                    <a th:href="@{/inventory(page=${currentPage + 1},size=10)}" class="px-4 py-2 bg-blue-500 text-white rounded" th:classappend="${currentPage == totalPages - 1} ? 'pointer-events-none' : ''">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function() {
        if (typeof jQuery === 'undefined') {
            console.error("jQuery failed to load");
            return;
        }
        $('#storeId').change(function() {
            const storeId = $(this).val();
            const $tableRows = $('#inventoryTable tbody tr:not(.no-data)');

            console.log('Selected Store ID:', storeId);

            if (!storeId) {
                $tableRows.show();
                $('.no-data').hide();
                return;
            }

            let hasMatchingRows = false;
            $tableRows.each(function() {
                const rowStoreId = $(this).data('storeId');
                console.log('Row Store ID:', rowStoreId);
                if (rowStoreId == storeId || (rowStoreId === undefined && storeId === 'null')) {
                    $(this).show();
                    hasMatchingRows = true;
                } else {
                    $(this).hide();
                }
            });

            $('.no-data').toggle(!hasMatchingRows);
        });
    });
</script>
</body>
</html>
