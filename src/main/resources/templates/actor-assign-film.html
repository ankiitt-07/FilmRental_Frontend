<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assign Film to Actor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Assign Film to Actor</h1>

    <div th:if="${warning}" class="alert alert-warning">
        <span th:text="${warning}"></span>
    </div>

    <form th:action="@{/actors/actors/assign-film/{id}(id=${actorId})}" method="post">
        <div class="mb-3">
            <label for="filmId" class="form-label">Select Film</label>
            <select class="form-control" id="filmId" name="filmId" required>
                <option value="">-- Select a Film --</option>
                <option th:each="film : ${films}" th:value="${film.filmId}" th:text="${film.title}"></option>
            </select>
            <small th:if="${films == null}" class="text-muted">No films available to assign.</small>
        </div>
        <button type="submit" class="btn btn-primary">Assign Film</button>
        <a th:href="@{/actors/actors/{id}/films(id=${actorId})}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
